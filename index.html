<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Four Pads — an instrument for the browser</title>
    <meta
      name="description"
      content="Four pads, four synthesised voices. Touch or press A S D F to play; higher up a pad is a higher note. Record a phrase and layer it."
    />

    <!-- The link-preview card resolves against this page, like any link. No
         og:title/og:description: scrapers fall back to the title and
         description above. -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Four Pads</a>
      </nav>
    </header>

    <main data-testid="stage">
      <div class="glow" data-testid="breath" aria-hidden="true"></div>

      <h1>Four Pads</h1>
      <p class="invite" data-testid="invite">
        Touch a pad, or press <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> <kbd>F</kbd>. Higher up
        the pad is a higher note.
      </p>

      <div class="pads" role="group" aria-label="Instrument pads">
        <button type="button" class="pad" data-pad="a" data-voice="drum" data-testid="pad-a">
          <span class="pad-ink" data-ink aria-hidden="true"></span>
          <span class="pad-badge" aria-hidden="true">A</span>
          <!-- A drum: struck skin on top, deep shell, crossed tension cables. -->
          <svg
            class="pad-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <ellipse cx="12" cy="6.3" rx="8.2" ry="3.1" />
            <path d="M3.8 6.3v9.4c0 1.7 3.7 3.1 8.2 3.1s8.2-1.4 8.2-3.1V6.3" />
            <path d="M4.7 9.7 8.5 14.7M8.5 10.3 4.7 15.3" stroke-width="1.35" />
            <path d="M19.3 9.7 15.5 14.7M15.5 10.3 19.3 15.3" stroke-width="1.35" />
            <path d="M12 10.1v5.3" stroke-width="1.35" />
          </svg>
          <span class="pad-name">Drum</span>
        </button>

        <button type="button" class="pad" data-pad="s" data-voice="bell" data-testid="pad-s">
          <span class="pad-ink" data-ink aria-hidden="true"></span>
          <span class="pad-badge" aria-hidden="true">S</span>
          <!-- A handbell, with its clapper swinging below. -->
          <svg
            class="pad-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 3.6a5.7 5.7 0 0 0-5.7 5.7c0 3.2-1.1 5.3-2.2 6.8h15.8c-1.1-1.5-2.2-3.6-2.2-6.8A5.7 5.7 0 0 0 12 3.6Z" />
            <path d="M12 3.6V2" />
            <path d="M9.5 19a2.5 2.5 0 0 0 5 0" />
          </svg>
          <span class="pad-name">Bell</span>
        </button>

        <button type="button" class="pad" data-pad="d" data-voice="noise" data-testid="pad-d">
          <span class="pad-ink" data-ink aria-hidden="true"></span>
          <span class="pad-badge" aria-hidden="true">D</span>
          <!-- Two claves struck together, with the impact marked above. -->
          <svg
            class="pad-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4.6 20 12.4 7" stroke-width="2.7" />
            <path d="M19.4 20 11.6 7" stroke-width="2.7" />
            <path d="M12 2.4v1.9M8.2 3.6l1 1.7M15.8 3.6l-1 1.7" stroke-width="1.5" />
          </svg>
          <span class="pad-name">Clack</span>
        </button>

        <button type="button" class="pad" data-pad="f" data-voice="glide" data-testid="pad-f">
          <span class="pad-ink" data-ink aria-hidden="true"></span>
          <span class="pad-badge" aria-hidden="true">F</span>
          <!-- A pitch sliding upward and settling. -->
          <svg
            class="pad-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M2.6 18.4c4.4 0 5.4-3.4 7.7-8C12.2 6.2 15.4 4.6 20.4 4.6" />
            <circle cx="20.4" cy="4.6" r="1.8" fill="currentColor" stroke="none" />
            <circle cx="2.6" cy="18.4" r="1.4" fill="currentColor" stroke="none" />
          </svg>
          <span class="pad-name">Glide</span>
          <span class="pad-hint">hold &amp; slide</span>
        </button>
      </div>

      <div class="controls">
        <button type="button" class="control" data-testid="beat-toggle" aria-pressed="true">
          Beat on
        </button>
        <span class="beat-dot" data-testid="beat-dot" aria-hidden="true"></span>
        <button type="button" class="control control-loop" data-testid="loop-advance">
          Record
        </button>
        <button type="button" class="control" data-testid="loop-clear" disabled>Clear</button>
      </div>

      <p class="status" data-testid="loop-status" role="status" aria-live="polite">
        Press Record when you want to keep a phrase.
      </p>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
